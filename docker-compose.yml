version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: neto-db
    environment:
      POSTGRES_DB: netobebidas
      POSTGRES_USER: neto
      POSTGRES_PASSWORD: ${DB_PASSWORD:-neto2024caminhar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neto -d netobebidas"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: neto-backend
    environment:
      DATABASE_URL: postgresql://neto:${DB_PASSWORD:-neto2024caminhar}@db:5432/netobebidas
      SECRET_KEY: ${SECRET_KEY:-netobebidas-chave-secreta-producao-aws}
      TOKEN_EXPIRE_MINUTES: "600"
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${API_URL:-}
    container_name: neto-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
